<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Shine App</title>

    <link rel="icon" type="image/png" href="https://shinejobconnect.com/images/fav.png">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #fff;
            color: #333;
        }

        /* Header image */
        .header-section {
            width: 100%;
            text-align: center;
        }

        .header-section img {
            width: 100%;
            height: auto;
        }

        /* Main content */
        main {
            text-align: center;
            padding: 50px 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            background: #0078ff;
            color: #fff;
            font-size: 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn img {
            height: 20px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .btn:hover {
            background: #005fd4;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
        }

        .divider span {
            height: 1px;
            width: 100px;
            background: #ddd;
            margin: 0 10px;
        }

        .google-btn {
            display: inline-block;
            border: 2px solid #0078ff;
            color: #0078ff;
            font-weight: 600;
            border-radius: 6px;
            padding: 12px 25px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .google-btn img {
            height: 20px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .google-btn:hover {
            background: #0078ff;
            color: #fff;
        }

        /* Cool places & Top hiring images */
        .section-img {
            width: 100%;
            margin: 40px 0;
            text-align: center;
        }

        .section-img img {
            width: 90%;
            max-width: 1200px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Footer image */
        footer {
            width: 100%;
            text-align: center;
            margin-top: 50px;
        }

        footer img {
            width: 100%;
            height: auto;
        }

        /* Bottom text */
        .footer-bottom {
            text-align: center;
            font-size: 14px;
            color: #666;
            padding: 15px 0;
            border-top: 1px solid #ddd;
            background: #f8f8f8;
        }

        .footer-bottom a {
            color: #0078ff;
            text-decoration: none;
            margin: 0 5px;
            transition: 0.3s;
        }

        .footer-bottom a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            main {
                padding: 30px 15px;
            }

            h2 {
                font-size: 22px;
            }

            p {
                font-size: 14px;
            }

            .btn,
            .google-btn {
                width: 90%;
                font-size: 15px;
            }

            .section-img img {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <div class="header-section">
        <img src="shineheader.webp" alt="Shine Header">
    </div>

    <!-- Main Content -->
    <main>
        <h2>Download Shine App</h2>
        <p>Start your career journey today! Download the Shine Android App and apply to top companies with one click.
        </p>

        <a href="Shine.apk" class="btn">
            <img src="https://cdn-icons-png.flaticon.com/128/888/888857.png" alt="Play"> Download
        </a>

       

       
    </main>

    <!-- Cool Places to Work -->
    <div class="section-img">
        <img src="coolplace.webp" alt="Cool Places to Work">
    </div>

    <!-- Top Hiring Companies -->
    <div class="section-img">
        <img src="tophire.webp" alt="Top Hiring Companies">
    </div>

    <!-- Footer -->
    <footer>
        <img src="shinebottom.webp" alt="Shine Footer">
    </footer>

    <!-- Footer Bottom Text -->
    <div class="footer-bottom">
        ©2025 Shine.com | <a href="#">Privacy Policy</a> | <a href="#">Terms</a>
    </div>

</body>

</html>
